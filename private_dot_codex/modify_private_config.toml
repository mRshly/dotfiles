{{- /* chezmoi:modify-template */ -}}
{{- /*
  ~/.codex/config.toml は Codex が trust や hooks.state を書き戻す可変ファイル。
  丸ごとは管理せず、ここで挙げたキーだけを保証する。
  - 既に揃っていれば live の内容をバイト単位でそのまま返し、
    Codex の整形との差分を作らない。
  - 1 つでも食い違えば toToml で全体を書き出し直す (管理しないキーは残る)。
    古いテーブルを取り除く必要があり、差分だけを書き換えると壊れやすいため。
    書き直しは揃うまでの 1 回だけで、以降は上の通りそのまま返す。
  - herdr-worker の profile は丸ごと保証する。サンドボックスの境界なので、
    手で足された宛先などを残さない。
  chezmoi re-add は使わないこと (マシン固有の状態を取り込んでしまう)。

  サンドボックスは permission profile で指定する。旧来の sandbox_mode /
  [sandbox_workspace_write] と併用すると profile が無視されるので取り除く。
  - extends = ":workspace" が旧 workspace-write に当たる。
  - Taskwarrior の DB は worktree の外にあるため書き込みを許可する。
  - Herdr のソケットへの接続を許可する。Codex はソケットの許可を
    ネットワークのプロキシで扱うので、features.network_proxy と
    network.enabled が要る。宛先 (domains) は書かないので、外へは出られない。
  詳しくは docs/claude-sandbox.md の Codex の節。
*/ -}}
{{- $home := .chezmoi.homeDir -}}
{{- $taskData := joinPath $home ".local/share/task" -}}
{{- $herdrSock := joinPath $home ".config/herdr/herdr.sock" -}}
{{- $profileName := "herdr-worker" -}}
{{- /*
  承認モードを Claude Code の defaultMode: "auto" に揃える。
  on-request + auto_review は `codex --approve-for-me` と同じで、承認要求を
  自動レビューに回す。明示的な deny は rules/claude-parity.rules が担う。
  web_search = "live" は Claude の WebSearch allow 相当。
*/ -}}
{{- $top := dict
      "approval_policy" "on-request"
      "approvals_reviewer" "auto_review"
      "default_permissions" $profileName
      "web_search" "live" -}}
{{- $profile := dict
      "extends" ":workspace"
      "filesystem" (dict $taskData "write")
      "network" (dict "enabled" true "unix_sockets" (dict $herdrSock "allow")) -}}
{{- $cfg := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $cfg = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $features := get $cfg "features" | default dict -}}
{{- $perms := get $cfg "permissions" | default dict -}}
{{- $ok := true -}}
{{- range $k, $v := $top -}}
{{-   if ne (toString (get $cfg $k)) $v -}}
{{-     $ok = false -}}
{{-   end -}}
{{- end -}}
{{- if or (hasKey $cfg "sandbox_mode") (hasKey $cfg "sandbox_workspace_write") -}}
{{-   $ok = false -}}
{{- end -}}
{{- if ne (toString (get $features "network_proxy")) "true" -}}
{{-   $ok = false -}}
{{- end -}}
{{- if ne (toJson (get $perms $profileName)) (toJson $profile) -}}
{{-   $ok = false -}}
{{- end -}}
{{- if $ok -}}
{{ .chezmoi.stdin }}
{{- else -}}
{{-   range $k, $v := $top -}}
{{-     $_ := set $cfg $k $v -}}
{{-   end -}}
{{-   $_ := unset $cfg "sandbox_mode" -}}
{{-   $_ = unset $cfg "sandbox_workspace_write" -}}
{{-   $_ = set $features "network_proxy" true -}}
{{-   $_ = set $cfg "features" $features -}}
{{-   $_ = set $perms $profileName $profile -}}
{{-   $_ = set $cfg "permissions" $perms -}}
{{ toToml $cfg }}
{{- end -}}
